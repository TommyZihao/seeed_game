limit_req_zone $binary_remote_addr zone=speech:10m rate=10r/m;
server {
 listen 443 ssl default_server;
 ssl_certificate /etc/letsencrypt/live/47.116.43.204/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/47.116.43.204/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_name 47.116.43.204;
 root /var/www/html;
 index index.html;
 location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
 location ~ /\. { deny all; }
 location = /seeed-game/api/players {
  client_max_body_size 1k;
  proxy_pass http://127.0.0.1:8081/api/players;
  proxy_set_header Host $host;
 }
 location ^~ /seeed-game/api/ {
  limit_req zone=speech burst=3 nodelay;
  limit_req_status 429;
  client_max_body_size 2m;
  proxy_pass http://127.0.0.1:8081/api/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 40s;
 }
 location = / { return 302 /seeed-game/; }
 location = /seeed-game { return 301 /seeed-game/; }
 location /seeed-game/ { alias /opt/seeed-game/public/; }
 location / { return 404; }
 gzip on;
 gzip_types application/javascript text/javascript text/css application/json image/svg+xml model/gltf-binary;
 add_header X-Content-Type-Options nosniff;
}

server {
 listen 80 default_server;
 server_name 47.116.43.204;
 location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 301 https://47.116.43.204$request_uri; }
}
